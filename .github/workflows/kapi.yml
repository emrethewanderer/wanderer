# Wanderer AI — KAPI
#
# 2026-09-02'ye kadar bu repoda hiçbir otomatik tetikleyici yoktu (denetim B1):
# 3.608 test, altı denetçi ve build zinciri yazılıydı ama hepsinin tetiği tek
# bir yerdeydi — geliştiricinin elle yazdığı `npx vitest run`. Kapısı olmayan
# kural zamanla tavsiyeye döner; tetikleyicisi olmayan kapı da öyle.
#
# Bu workflow o boşluğu kapatır. Sıra bilinçlidir: önce ucuz ve hızlı olan
# (build), sonra pahalı olan (tam süit) — kırık bir build'de 2.800 test
# koşturmak kimseye bilgi vermez.

name: Kapı

on:
  # push VE pull_request birlikte: push dalın kendi ağacını sınar,
  # pull_request ise base ile birleşmiş ağacı (refs/pull/N/merge) — ikisi
  # farklı ağaçtır. Bu workflow'un varlık sebebi tam olarak "koşulan ağaç,
  # commit'lenen ağaç olmalı" kuralı (PROTOKOL-FABLE.md §3.5 madde 2);
  # çifte koşu bilinçlidir, "israf" diye SÖKÜLMEZ.
  #
  # 2026-09-03: o cümledeki "ikisi farklı ağaçtır" bir VARSAYIMDI ve ölçüldüğünde
  # beş PR'nin beşinde de yanlış çıktı — merge commit'inin ağacı ile dalın head
  # ağacı bit bit aynıydı (3992dbe/6134284, a48e2c1/428ef2e, 663b133/db7f3bf,
  # fc91681/a79210a, ad68dbd/92e33fe). Sebep basit: base yalnız Emre'nin
  # merge'leriyle ilerliyor ve PR'ler base ilerlemeden, açıldıktan 8–18 saniye
  # sonra merge ediliyor. Yani pull_request koşusu push koşusunun bire bir
  # kopyasıydı; PR sayfasında Emre'nin gördüğü "1 in progress, 1 successful"
  # tam olarak buydu — bitmiş dal koşusu ile yeni başlamış PR kopyası.
  #
  # Tetik SÖKÜLMEDİ; gerekçesi ÖLÇÜLEBİLİR yapıldı. Aşağıdaki "Ağaç kimliği"
  # adımı ikisinin farkını her koşuda gerçekten hesaplar: ağaçlar farklıysa
  # (base ilerlemiş) kapı tam koşar — kuralın korumak istediği hâl budur;
  # aynıysa aynı ağacı ikinci kez sınamaz, çünkü aynı ağacı iki kez sınamak
  # bilgi üretmez, yalnız bekleme üretir.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  # Guard'ın kanıt sorgusu için: karşı koşunun check-run sonucu okunur.
  # `contents: read` checkout'un kendisi için; ikisi de salt okuma.
  contents: read
  checks: read

concurrency:
  # Grup AĞACIN KİMLİĞİDİR, dalın adı değil — ve bu 2026-09-03'te ölçülerek
  # değişti. Eskiden `github.ref` idi; push koşusu `refs/heads/<dal>`, PR
  # koşusu `refs/pull/N/merge` altına düşüyordu, yani AYRI gruplar, yani
  # PARALEL koşu. Sonuç bir yarıştı: PR koşusu, "Ağaç kimliği" adımında dal
  # koşusunun check-run'ını arıyor ama dal koşusu daha bitmemiş oluyordu.
  # Kanıt yok → kapı tam koşuyor → aynı ağaç iki kez sınanıyordu.
  #
  # Bedeli koşu #63/#64'te göründü: aynı sha (e3f7f9d), iki koşu, biri yeşil
  # biri KIRMIZI — çünkü ikincisi npm registry'nin 503 verdiği dakikaya denk
  # geldi. Fark ağaçta değil ZAMANDAYDI, ve o farkı üreten şey bu gruptu.
  #
  # Artık ikisi de aynı gruba düşer (head sha), yani PR koşusu dal koşusunun
  # ARDINDAN kuyruklanır ve kanıtı bulup atlar. Yarış ortadan kalkar.
  #
  # cancel-in-progress KAPALI ve bu bilinçlidir: aynı gruptaki ikinci koşu
  # iptal edilecek olsaydı PR check'i hiç sonuçlanmazdı. Ardışık push'lar
  # farklı sha taşır, yani farklı gruptur — biri ötekini zaten iptal etmez.
  # Kaybedilen tek şey "aynı dalda hızlı ardışık push'ta eskisini iptal et"
  # davranışıdır; kazanılan şey her commit'in kendi kaydıdır (workflow'un
  # main için zaten savunduğu ilke).
  group: kapi-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  kapi:
    # Ad event'e göre ayrışır. Eskiden iki koşu da "build · süit · denetçiler"
    # diye görünüyordu ve PR sayfasında ayırt edilemiyordu — aynı adı taşıyan
    # iki satırdan hangisinin neyi sınadığı okunamıyorsa, okuyan kişi ikisini
    # de bir tören sayar. Artık dal ağacı ile birleşmiş ağaç adıyla görünür.
    name: ${{ github.event_name == 'pull_request' && 'birleşmiş ağaç' || 'dal ağacı' }} · build · süit · denetçiler
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Node 20 deprecation uyarısından çıkmak için v5'e sabitlendi (checkout
      # ve setup-node): v6/v7 de yayında ama v7 ESM göçü taşıyor, bu turda
      # gereksiz risk — v5 deprecation'ı çözen en küçük sıçrama.
      - uses: actions/checkout@v5
        with:
          # PR koşusunda çekilen ref `refs/pull/N/merge`, bir merge commit'tir:
          # birinci parent base, İKİNCİ parent dalın kendi head'i. Ağaç
          # karşılaştırması iki parent'ı da gerektirir; derinlik 2 yeter,
          # fetch-depth: 0'ın bedelini ödemeye gerek yok.
          fetch-depth: 2

      - name: Ağaç kimliği
        id: agac
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Karşı koşunun check-run adı. Aşağıdaki job `name:` ifadesinin push
          # dalıyla HARFİ HARFİNE aynı olmalı — ayrışırsa kanıt sorgusu hiçbir
          # şey bulamaz ve kapı sessizce her PR'de tam koşar (güvenli ama
          # işlevsiz). tests/kapi-workflow.test.js ikisinin eşitliğini sınar.
          DAL_KOSUSU: 'dal ağacı · build · süit · denetçiler'
        # Kapının hangi ağacı sınadığını burada ADLANDIRIR. Yargı tek soruya
        # bakar: birleşmiş ağaç, dalın push'unda zaten sınanmış ağacın kendisi mi?
        # Karşılaştırma commit sha'sıyla DEĞİL tree sha'sıyla yapılır — merge
        # commit'in sha'sı daima farklıdır, ağacı olmayabilir.
        # Okunamayan her hâlde yargı "koş"tur: şüphe kapıyı gevşetmez.
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo "Dal/main koşusu — ağaç koşulsuz sınanır."
            echo "kos=evet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --verify --quiet ŞARTTIR: onsuz `git rev-parse` çözemediği ref'i
          # stdout'a OLDUĞU GİBİ basar (exit 128 ama çıktı dolu) ve değişken
          # boş kalmaz — aşağıdaki "okunamadı" dalı hiç çalışmaz, kapı yanlış
          # gerekçeyle karar verir. tests/kapi-workflow.test.js bunu sınar.
          birlesmis=$(git rev-parse --verify --quiet 'HEAD^{tree}' 2>/dev/null || echo '')
          dal=$(git rev-parse --verify --quiet 'HEAD^2^{tree}' 2>/dev/null || echo '')

          if [ -z "$birlesmis" ] || [ -z "$dal" ]; then
            echo "Ağaç kimliği OKUNAMADI (birleşmiş='$birlesmis' dal='$dal')."
            echo "Şüphede kapı koşar — sınanamayan bir ağaç geçmiş sayılmaz."
            echo "kos=evet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "birleşmiş ağaç : $birlesmis"
          echo "dal ağacı      : $dal"

          if [ "$birlesmis" = "$dal" ]; then
            # Ağaç eşitliği "sınandı" DEMEK DEĞİLDİR — yalnız "aynı ağaç" demektir.
            # İkisini birbirine karıştırmak kapıyı sahte yeşile açar; en net hâli
            # fork PR'idir: `push` tetiği yalnız BU repodaki push'larda koşar, yani
            # fork'tan gelen bir dalın ağacı burada HİÇ sınanmamıştır — ama ağaç
            # kimliği yine eşit çıkar. Aynısı iptal edilmiş ya da kırmızı kapanmış
            # bir dal koşusu için de geçerlidir (push ve pull_request ayrı
            # concurrency gruplarındadır, biri ötekinin hâlini bilmez).
            #
            # O yüzden atlamanın şartı ağaç değil KANITTIR (PROTOKOL-FABLE.md §6.10):
            # karşı koşunun check-run'ı gerçekten `success` mi? Kanıt yoksa,
            # okunamıyorsa ya da API susarsa yargı "koş"tur.
            kanit=$(curl -sS --max-time 20 \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              2>/dev/null \
              | jq -r --arg ad "$DAL_KOSUSU" \
                  '[.check_runs[]? | select(.name == $ad and .conclusion == "success")] | length' \
              2>/dev/null || echo '0')

            if [ "${kanit:-0}" -gt 0 ] 2>/dev/null; then
              echo "→ AYNI AĞAÇ ve dal koşusu KANITLI geçti ($DAL_KOSUSU / success)."
              echo "  Aynı ağacı ikinci kez sınamak bilgi üretmez — kapı burada durur."
              echo "kos=hayir" >> "$GITHUB_OUTPUT"
            else
              echo "→ AYNI AĞAÇ ama KANIT YOK: '$DAL_KOSUSU' bu sha için başarıyla"
              echo "  kapanmış görünmüyor (fork PR'i, iptal, kırmızı ya da okunamayan API)."
              echo "  Sınanmamış bir ağaç geçmiş sayılmaz — kapı tam koşar."
              echo "kos=evet" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "→ FARKLI AĞAÇ. Base ilerlemiş; commit'lenecek ağaç dalınkinden"
            echo "  başkadır ve HENÜZ SINANMADI. Kapının varlık sebebi tam budur."
            echo "kos=evet" >> "$GITHUB_OUTPUT"
          fi

      - name: Node kur
        if: steps.agac.outputs.kos == 'evet'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıklar
        if: steps.agac.outputs.kos == 'evet'
        run: npm ci

      - name: Build
        if: steps.agac.outputs.kos == 'evet'
        # build.sh 2026-09-02'ye kadar Linux'ta hiç koşmamıştı: üç `sed -i ''`
        # çağrısı BSD sözdizimindeydi ve GNU sed onları exit 2 ile öldürüyordu
        # (denetim A1). Bu adım o kırığın geri gelmesini imkânsız kılar.
        run: ./build.sh

      - name: Tip kontrolü
        if: steps.agac.outputs.kos == 'evet'
        # NOT: tsconfig.json `checkJs:false` taşır, yani bu adım bugün yalnız
        # .d.ts dosyalarını görür (denetim B3). Kapı olarak zayıftır ama
        # ücretsizdir; checkJs açıldığı gün burası kendiliğinden sertleşir.
        run: npm run typecheck

      - name: Doğrulama tarayıcısı (duman)
        if: steps.agac.outputs.kos == 'evet'
        # Kapının üçüncü adımı (PROTOKOL-FABLE.md §3.3): sayfayı gerçekten aç,
        # canlı DOM'a bak, konsolu oku. Build ve süit yeşilken de uygulama
        # ekranda kırık olabilir — "beyaz ekran" sınıfını yalnız bu adım görür.
        # Chromium runner imajından çözülür (chromiumYoluCoz zinciri); yoksa
        # koşucu exit 1 verir ve kapı kırmızı kapanır — sessizce atlanmaz.
        run: node scripts/dogrula.mjs --senaryo tests/senaryolar/acilis.mjs

      - name: Tam süit
        if: steps.agac.outputs.kos == 'evet'
        # 153 dosya / 3.600+ test. Denetçi kapıları (gerçeklik, tasarım,
        # bağsız-ad, yetim-köprü, eksen, ihtimalsel, XSS, bundle) bu süitin
        # İÇİNDE koşar — ayrı adım gerekmez, hepsi tests/*-kapisi.test.js.
        run: npx vitest run

      - name: Bağımlılık açıkları
        if: steps.agac.outputs.kos == 'evet'
        # Üretim bağımlılıkları temiz olmalı. Bu adım kırmızıya dönerse bir
        # üçüncü taraf paketinde yeni bir danışma yayınlanmış demektir —
        # susturulacak bir gürültü değil, bakılacak bir haber.
        #
        # 2026-09-03: adım `npm audit --audit-level=high` idi ve İKİ FARKLI
        # sebeple exit 1 veriyordu, ikisini ayırt etmeden:
        #   1. gerçek bir açık bulundu            → bakılacak haber
        #   2. registry cevap vermedi (503)       → bizim ağacımızla ilgisiz
        # O gün ikincisi oldu: koşu #64'te 171 dosya / 3857 testin hepsi yeşil
        # geçti, sonra `npm audit` yedi dakika retry'dan sonra
        # "503 Service Unavailable" ile düştü ve kapı kırmızı kapandı. Aynı
        # commit'in push koşusu (#63) bir saat önce yeşildi — fark ağaçta
        # değil, ZAMANDAYDI.
        #
        # Bu ayrım repoda zaten var: doğrulama tarayıcısının üç kovası
        # (PROTOKOL-FABLE.md §3.3) — İHLAL kapıyı kırar, DIŞ ORIGIN kırmaz
        # ama raporda adıyla görünür. Kuralı bir kez daha yazmak yerine aynı
        # kural buraya taşındı: *"onun sessizliğini uygulamanın kırığı saymak
        # kapıyı gürültüye boğar, sessizce yutmak sahte yeşil üretir;
        # ortası: göster."*
        #
        # `set -e` YOK ve bu bilinçlidir: exit kodunu bu betik kendisi verir.
        run: |
          set -uo pipefail

          # `timeout` bir tavandır (§10.6): npm'in kendi retry'ı 7 dakika
          # sürebiliyor ve bu adımın işi beklemek değil ölçmek.
          kos() { timeout 120 npm audit --omit=dev --json 2>/dev/null; }
          hata_mi() { printf '%s' "$1" | jq -e 'has("error")' >/dev/null 2>&1; }

          cikti=$(kos || true)

          # 503 geçicidir; BİR kez daha denenir. İkinci denemede de düşerse
          # bu bir kesintidir, bizim kırığımız değil — ve tavan burada dolar.
          if [ -z "$cikti" ] || hata_mi "$cikti"; then
            echo "İlk deneme dış servis hatasıyla düştü — 15 sn sonra bir kez daha."
            sleep 15
            cikti=$(kos || true)
          fi

          if [ -z "$cikti" ] || hata_mi "$cikti"; then
            ozet=$(printf '%s' "$cikti" | jq -r '.error.summary // .error.code // "yanıt yok"' 2>/dev/null || echo 'yanıt yok')
            echo "::warning title=Bağımlılık taraması YAPILAMADI::DIŞ ORIGIN — npm registry yanıt vermedi ($ozet). Kapı kırılmadı; ama bu koşuda açık taraması KOŞMADI."
            echo "──────────────────────────────────────────────"
            echo "DIŞ ORIGIN — npm registry: $ozet"
            echo "Kırık bizim ağacımızda değil. Kapı burada KIRILMAZ."
            echo "Ama taranmadığı da YAZILI: bu koşu 'bağımlılıklar temiz'"
            echo "DEMİYOR, 'bakılamadı' diyor (§6.10 — kanıtı olmayan değer yoktur)."
            exit 0
          fi

          yuksek=$(printf '%s' "$cikti" | jq -r '.metadata.vulnerabilities.high // "yok"' 2>/dev/null || echo 'yok')
          kritik=$(printf '%s' "$cikti" | jq -r '.metadata.vulnerabilities.critical // "yok"' 2>/dev/null || echo 'yok')

          # Ne bulgu ne hata: çıktı biçimi tanınmadı. "Açık yok" DENEMEZ —
          # bilmediğini bilmek, bilmediğini gizlemekten iyidir.
          if [ "$yuksek" = 'yok' ] || [ "$kritik" = 'yok' ]; then
            echo "::warning title=npm audit çıktısı okunamadı::Ne bulgu ne hata alanı var; biçim tanınmadı. Kapı kırılmadı ama tarama doğrulanmadı."
            printf '%s' "$cikti" | head -c 2000
            echo
            exit 0
          fi

          echo "high: $yuksek · critical: $kritik"
          if [ "$yuksek" -gt 0 ] 2>/dev/null || [ "$kritik" -gt 0 ] 2>/dev/null; then
            echo "::error title=Bağımlılık açığı::Üretim bağımlılıklarında $kritik kritik, $yuksek yüksek açık — bakılacak bir haber."
            timeout 120 npm audit --omit=dev --audit-level=high || true
            exit 1
          fi

          echo "Üretim bağımlılıkları temiz (kritik 0 · yüksek 0)."

